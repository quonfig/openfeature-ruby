name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Test against sdk-ruby main, not the released gem (see Gemfile).
      QUONFIG_SDK_RUBY_PATH: ../sdk-ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openfeature-ruby

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quonfig/sdk-ruby
          path: sdk-ruby

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: openfeature-ruby

      - name: Committed Gemfile.lock has no out-of-repo PATH source
        working-directory: openfeature-ruby
        run: |
          if grep -nE '^  remote: (\.\.|/)' Gemfile.lock; then
            echo "Gemfile.lock was generated with QUONFIG_SDK_RUBY_PATH set; regenerate it without." >&2
            exit 1
          fi

      - name: bundle install
        working-directory: openfeature-ruby
        run: bundle install

      - name: Rubocop
        working-directory: openfeature-ruby
        run: bundle exec rubocop --no-color

      - name: rake test
        working-directory: openfeature-ruby
        run: bundle exec rake test
